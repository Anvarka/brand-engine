name: publish

on:
  schedule:
    - cron: "17 7 * * 2,4,6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brand-engine-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
      - name: publish
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_MODEL_CHEAP: ${{ vars.LLM_MODEL_CHEAP }}
          LLM_MODEL_DEFAULT: ${{ vars.LLM_MODEL_DEFAULT }}
          LLM_MODEL_SMART: ${{ vars.LLM_MODEL_SMART }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION }}
          LINK_PLACEMENT: ${{ vars.LINK_PLACEMENT }}
        run: |
          python scripts/publish.py
      - name: Commit state
        run: |
          ./scripts/commit_state.sh "publish: post to LinkedIn"
